[workspace]
resolver = "2"
members = ["crates/nuru-core", "crates/nuru", "crates/nuru-restart"]
exclude = ["src-tauri"]

[workspace.package]
version = "0.0.1"
edition = "2021"
authors = ["SimpleFox"]
license = "GPL-3.0-only"
rust-version = "1.85"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 16
panic = "abort"
strip = true
